stages:
  - build
  - test
  - integration
  - deploy

variables:
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - echo "Building application image..."
    - docker build -t ci-cd-genai-demo:${CI_COMMIT_SHORT_SHA} .
  artifacts:
    paths:
      - app/

unit-test:
  stage: test
  script:
    - echo "Running unit tests..."
    - pip install -r requirements.txt && pip install pytest
    - python -m pytest -q tests/
  allow_failure: false

# Showcase injection: this stage fails ~70% of the time to demonstrate the
# GenAI auto-fix loop. It is NOT a real product test — see docs/ai-capabilities.md.
integration-test:
  stage: integration
  script:
    - echo "Running integration tests..."
    - python -c "import random,sys; sys.exit(1) if random.random() < 0.7 else print('integration ok')"
  allow_failure: false

deploy:
  stage: deploy
  script:
    - echo "Deploying ${CI_COMMIT_REF_NAME} to staging..."
  only:
    - main
