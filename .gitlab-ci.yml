stages:
  - build
  - test
  - integration
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  # Runner uses the docker executor; give CI jobs a Python image that has pip.
  CI_IMAGE: python:3.11-slim

build:
  stage: build
  image: $CI_IMAGE
  script:
    - echo "Validating application image build context..."
    - python -m py_compile app/*.py
    - echo "Syntax OK; (docker build of demo image is exercised by the GenAI app container itself)"
  artifacts:
    paths:
      - app/

unit-test:
  stage: test
  image: $CI_IMAGE
  script:
    - echo "Running unit tests..."
    - pip install --no-cache-dir -r requirements.txt && pip install --no-cache-dir pytest
    - python -m pytest -q tests/
  allow_failure: false

# Showcase injection: this stage fails ~70% of the time to demonstrate the
# GenAI auto-fix loop. It is NOT a real product test — see docs/ai-capabilities.md.
integration-test:
  stage: integration
  image: $CI_IMAGE
  script:
    - echo "Running integration tests..."
    - python -c "import random,sys; sys.exit(1) if random.random() < 0.7 else print('integration ok')"
  allow_failure: false

deploy:
  stage: deploy
  image: $CI_IMAGE
  script:
    - echo "Deploying ${CI_COMMIT_REF_NAME} to staging..."
  only:
    - master
