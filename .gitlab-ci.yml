stages:
  - build
  - test
  - integration
  - deploy

# No auto-start on push: pipelines run only when a user clicks "Run Pipeline"
# (manual/API trigger) or when a merge request is opened (fix verification).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "push"

variables:
  DOCKER_DRIVER: overlay2
  # Runner uses the docker executor; give CI jobs a Python image that has pip.
  CI_IMAGE: python:3.11-slim

build:
  stage: build
  image: $CI_IMAGE
  script:
    - echo "Validating application image build context..."
    - python -m compileall -q app/
    - echo "Syntax OK; (docker build of demo image is exercised by the GenAI app container itself)"
  artifacts:
    paths:
      - app/

unit-test:
  stage: test
  image: $CI_IMAGE
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1 || true
  script:
    - echo "Running unit tests..."
    - pip install --no-cache-dir -r requirements.txt && pip install --no-cache-dir pytest
    - python -m pytest -q tests/unit
  allow_failure: false

# Integration tests: REAL tests (tests/integration/test_integration.py) that
# deterministically fail in this demo repo — they assert the payments service
# serves 6 parallel workers against a 5-connection DB pool (app/db/pool.py).
# This is the failure the demo showcases; it is NOT a coin flip.
integration-test:
  stage: integration
  image: $CI_IMAGE
  script:
    - echo "Running integration tests (payments service under load)..."
    - pip install --no-cache-dir -r requirements.txt && pip install --no-cache-dir pytest
    - python -m pytest -q tests/integration
  allow_failure: false

deploy:
  stage: deploy
  image: $CI_IMAGE
  script:
    - echo "Deploying ${CI_COMMIT_REF_NAME} to staging..."
  only:
    - master
